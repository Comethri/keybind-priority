name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the jar
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: keybind-priority
          path: build/libs/*.jar

  selftest:
    name: NeoForge ${{ matrix.neoforge }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The one jar, started on the first and last NeoForge build (beta or stable) of every
        # Minecraft 1.21.x. NeoForge 21.10.63 is left out: it fails to set up by itself.
        neoforge:
          - '21.0.143'
          - '21.0.167'
          - '21.1.1'
          - '21.1.252'
          - '21.2.0-beta'
          - '21.2.1-beta'
          - '21.3.56'
          - '21.3.97'
          - '21.4.121'
          - '21.4.158'
          - '21.5.74'
          - '21.5.98'
          - '21.6.0-beta'
          - '21.6.20-beta'
          - '21.7.0-beta'
          - '21.7.25-beta'
          - '21.8.9'
          - '21.8.54'
          - '21.9.0-beta'
          - '21.9.16-beta'
          - '21.10.64'
          - '21.11.42'
          - '21.11.45'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: keybind-priority
          path: dist

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri imagemagick

      # The early loading window times out on the software-rendered virtual display now and then.
      - name: Turn off the early loading window
        run: |
          mkdir -p testrun/run/config
          echo 'earlyWindowControl = false' > testrun/run/config/fml.toml

      - name: Start the game with the jar, run the self test and screenshot the menu
        shell: bash
        run: |
          jar=$(ls dist/*.jar)
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          ./gradlew :testrun:runSelftest -Ptest_neo_version=${{ matrix.neoforge }} -Pmod_jar=$PWD/$jar > selftest.log 2>&1 &
          game=$!
          for i in $(seq 1 900); do
            if grep -q "KEYBIND_PRIORITY_SELFTEST: MENU_OPEN" selftest.log; then
              sleep 2
              import -display :99 -window root menu.png && echo "screenshot taken"
              break
            fi
            kill -0 $game 2>/dev/null || break
            sleep 1
          done
          wait $game
          status=$?
          cat selftest.log
          exit $status

      - name: Check result
        if: always()
        run: |
          grep "Using compat layer\|input mixins\|KEYBIND_PRIORITY_SELFTEST" selftest.log
          grep -q "KEYBIND_PRIORITY_SELFTEST: PASS" selftest.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.neoforge }}
          path: |
            selftest.log
            menu.png
            testrun/run/logs/
            testrun/run/crash-reports/
          if-no-files-found: ignore
