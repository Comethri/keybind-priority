name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build all versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: keybind-priority
          path: versions/*/build/libs/*.jar

  selftest:
    name: ${{ matrix.minecraft }} / NeoForge ${{ matrix.neoforge }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # First and last stable NeoForge build of every line each jar declares support for.
        # (21.10.63 is left out: NeoForge itself fails to set up on it, so the range starts at 21.10.64.)
        include:
          - { minecraft: '1.21.1', neoforge: '21.0.143' }
          - { minecraft: '1.21.1', neoforge: '21.0.167' }
          - { minecraft: '1.21.1', neoforge: '21.1.1' }
          - { minecraft: '1.21.1', neoforge: '21.1.252' }
          - { minecraft: '1.21.3', neoforge: '21.3.56' }
          - { minecraft: '1.21.3', neoforge: '21.3.97' }
          - { minecraft: '1.21.4', neoforge: '21.4.121' }
          - { minecraft: '1.21.4', neoforge: '21.4.158' }
          - { minecraft: '1.21.5', neoforge: '21.5.74' }
          - { minecraft: '1.21.5', neoforge: '21.5.98' }
          - { minecraft: '1.21.8', neoforge: '21.8.9' }
          - { minecraft: '1.21.8', neoforge: '21.8.54' }
          - { minecraft: '1.21.10', neoforge: '21.10.64' }
          - { minecraft: '1.21.11', neoforge: '21.11.42' }
          - { minecraft: '1.21.11', neoforge: '21.11.45' }
          # Trial: Minecraft versions NeoForge only released betas for, run with the neighbouring jar.
          - { minecraft: '1.21.3', neoforge: '21.2.0-beta', extra: '-Pminecraft_version_range=[1.21.2,1.21.3] -Pneo_version_range=[21.2.0-beta,21.4)' }
          - { minecraft: '1.21.3', neoforge: '21.2.1-beta', extra: '-Pminecraft_version_range=[1.21.2,1.21.3] -Pneo_version_range=[21.2.0-beta,21.4)' }
          - { minecraft: '1.21.8', neoforge: '21.6.0-beta', extra: '-Pminecraft_version_range=[1.21.6,1.21.8] -Pneo_version_range=[21.6.0-beta,21.9)' }
          - { minecraft: '1.21.8', neoforge: '21.6.20-beta', extra: '-Pminecraft_version_range=[1.21.6,1.21.8] -Pneo_version_range=[21.6.0-beta,21.9)' }
          - { minecraft: '1.21.8', neoforge: '21.7.0-beta', extra: '-Pminecraft_version_range=[1.21.6,1.21.8] -Pneo_version_range=[21.6.0-beta,21.9)' }
          - { minecraft: '1.21.8', neoforge: '21.7.25-beta', extra: '-Pminecraft_version_range=[1.21.6,1.21.8] -Pneo_version_range=[21.6.0-beta,21.9)' }
          - { minecraft: '1.21.10', neoforge: '21.9.0-beta', extra: '-Pminecraft_version_range=[1.21.9,1.21.10] -Pneo_version_range=[21.9.0-beta,21.11)' }
          - { minecraft: '1.21.10', neoforge: '21.9.16-beta', extra: '-Pminecraft_version_range=[1.21.9,1.21.10] -Pneo_version_range=[21.9.0-beta,21.11)' }
    env:
      PROJECT: ':${{ matrix.minecraft }}'
      NEO: '-Pneo_version=${{ matrix.neoforge }} ${{ matrix.extra }}'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew $PROJECT:build $NEO

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri imagemagick

      # The early loading window times out on the software-rendered virtual display now and then.
      - name: Turn off the early loading window
        run: |
          mkdir -p versions/${{ matrix.minecraft }}/run-selftest/config
          echo 'earlyWindowControl = false' > versions/${{ matrix.minecraft }}/run-selftest/config/fml.toml

      - name: Start the game, run the self test and screenshot the menu
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          ./gradlew $PROJECT:runSelftest $NEO > selftest.log 2>&1 &
          game=$!
          for i in $(seq 1 600); do
            if grep -q "KEYBIND_PRIORITY_SELFTEST: MENU_OPEN" selftest.log; then
              sleep 2
              import -display :99 -window root menu.png && echo "screenshot taken"
              break
            fi
            kill -0 $game 2>/dev/null || break
            sleep 1
          done
          wait $game
          status=$?
          cat selftest.log
          exit $status

      - name: Check result
        if: always()
        run: |
          grep "KEYBIND_PRIORITY_SELFTEST" selftest.log
          grep -q "KEYBIND_PRIORITY_SELFTEST: PASS" selftest.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.minecraft }}-${{ matrix.neoforge }}
          path: |
            selftest.log
            menu.png
            versions/${{ matrix.minecraft }}/run-selftest/logs/
            versions/${{ matrix.minecraft }}/run-selftest/crash-reports/
          if-no-files-found: ignore
