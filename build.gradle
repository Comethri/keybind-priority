plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group

base {
    archivesName = "keybind-priority-neoforge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }

        // CI: starts the game, runs SelfTest and quits (see .github/workflows/test.yml)
        selftest {
            client()
            gameDirectory = project.file('run-selftest')
            systemProperty 'keybindpriority.selftest', 'true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def props = [
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_license          : mod_license,
            minecraft_version_range: minecraft_version_range,
            neo_version_range    : neo_version_range,
            loader_version_range : loader_version_range,
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${mod_id}" }
    }
}
