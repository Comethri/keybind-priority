pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'keybind-priority'

// One subproject per supported Minecraft version: versions/<minecraft>/version.properties
file('versions').listFiles().findAll { new File(it, 'version.properties').exists() }.sort().each { dir ->
    include dir.name
    project(":${dir.name}").projectDir = dir
}
