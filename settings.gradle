pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'keybind-priority'

// Compat parts, each compiled against the Minecraft version it is for, packed into the one jar.
include 'compat-1.21.6'
project(':compat-1.21.6').projectDir = file('compat/v1_21_6')
include 'compat-1.21.9'
project(':compat-1.21.9').projectDir = file('compat/v1_21_9')

// Starts the finished jar on any NeoForge version: ./gradlew :testrun:runSelftest -Ptest_neo_version=...
include 'testrun'
